<!doctype html>
<!--
  Social preview card (1200×630) for wendyfan.com.
  Rendered to public/og-image.jpg with headless Chrome (see README → "Link preview image").
  Uses the same self-hosted fonts as the site.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Fraunces'; src: url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-opsz-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Fraunces'; font-style: italic; src: url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-opsz-italic.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Manrope'; src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'NameSC'; src: url('../../public/fonts/wendy-name-sc.woff2') format('woff2'); }

  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; color: #f4ead9; font-family: 'Manrope', sans-serif;
    background:
      radial-gradient(ellipse 55% 60% at 78% 50%, rgba(242,166,121,.16), transparent 70%),
      radial-gradient(ellipse 45% 50% at 10% 15%, rgba(217,160,166,.12), transparent 70%),
      radial-gradient(ellipse 50% 50% at 95% 95%, rgba(169,156,201,.14), transparent 70%),
      radial-gradient(ellipse 120% 100% at 50% 50%, #241e2d 0%, #1b1722 55%, #121017 100%);
  }
  /* stars */
  .stars { position: absolute; inset: 0;
    background-image:
      radial-gradient(1.2px 1.2px at 12% 22%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 28% 78%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.4px 1.4px at 46% 12%, rgba(255,240,220,.7), transparent),
      radial-gradient(1px 1px at 55% 88%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.2px 1.2px at 63% 30%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 88% 12%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.6px 1.6px at 96% 62%, rgba(255,235,215,.7), transparent),
      radial-gradient(1px 1px at 72% 92%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 6% 60%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.2px 1.2px at 38% 46%, rgba(255,255,255,.35), transparent);
  }

  /* --- solar system (right) --- */
  .system { position: absolute; left: 860px; top: 315px; }
  .orbit { position: absolute; left: 0; top: 0; border-radius: 50%; border: 1.2px solid rgba(244,234,217,.16);
    transform: translate(-50%,-50%) rotate(-12deg); }
  .o1 { width: 360px; height: 150px; }
  .o2 { width: 540px; height: 230px; }
  .o3 { width: 720px; height: 310px; border-color: rgba(244,234,217,.11); }
  .halo { position: absolute; width: 460px; height: 460px; transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(246,178,127,.42) 0%, rgba(232,194,122,.16) 35%, transparent 68%); }
  .sun { position: absolute; width: 196px; height: 196px; transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #fff1d6 0%, #ffd9a8 14%, #f2a679 48%, #e07a4f 80%, #c8664a 100%);
    box-shadow: 0 0 60px rgba(242,166,121,.55), inset -18px -22px 40px rgba(160,70,40,.35); }
  .sun span { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Fraunces'; font-weight: 500;
    font-size: 25px; letter-spacing: .38em; padding-left: .38em; color: #fff8ee; text-shadow: 0 0 14px rgba(200,102,74,.6); }
  .planet { position: absolute; border-radius: 50%; transform: translate(-50%,-50%); }
  .p-eng { left: -150px; top: -82px; width: 46px; height: 46px; background: radial-gradient(circle at 35% 35%, #f2b48d, #c8664a 55%, #7d3423); }
  .p-eng::after { content: ''; position: absolute; left: 50%; top: 50%; width: 92px; height: 26px; border-radius: 50%;
    border: 5px solid rgba(242,180,141,.45); transform: translate(-50%,-50%) rotate(-18deg); }
  .p-cre { left: -262px; top: 62px; width: 38px; height: 38px; background: radial-gradient(circle at 35% 35%, #f7e3da, #d9a0a6 55%, #8f5a6a); }
  .p-jou { left: 210px; top: 120px; width: 34px; height: 34px; background: radial-gradient(circle at 35% 35%, #f8f1e4, #e2d1b4 55%, #a88d6b); }
  .p-fut { left: 268px; top: -96px; width: 50px; height: 50px; background: radial-gradient(circle at 35% 35%, #d4cbe6, #9a9cc4 55%, #5d6787);
    box-shadow: 0 0 22px rgba(195,184,236,.45); }

  /* --- text (left) --- */
  .copy { position: absolute; left: 84px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; width: 640px; }
  .eyebrow { font-size: 15px; font-weight: 600; letter-spacing: .36em; text-transform: uppercase; color: #f2a679; }
  .brand { margin-top: 14px; font-family: 'Fraunces'; font-weight: 300; font-size: 148px; line-height: .92; letter-spacing: -.01em;
    font-variation-settings: 'opsz' 144; text-shadow: 0 0 50px rgba(242,166,121,.18); }
  .names { margin-top: 20px; font-size: 32px; letter-spacing: .04em; color: rgba(244,234,217,.9); }
  .names .zh { font-family: 'NameSC', serif; letter-spacing: .12em; }
  .names .dot { color: #f2a679; margin: 0 .35em; }
  .role { margin-top: 22px; white-space: nowrap; font-size: 16px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: rgba(244,234,217,.6); }
  .tagline { margin-top: 14px; font-family: 'Fraunces'; font-style: italic; font-size: 24px; color: rgba(244,234,217,.7); }
  .url { position: absolute; left: 84px; bottom: 48px; display: flex; align-items: center; gap: 12px;
    font-size: 19px; font-weight: 600; letter-spacing: .06em; color: rgba(244,234,217,.85); }
  .url i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 38% 35%, #ffe2bf, #f2a679 55%, #c8664a);
    box-shadow: 0 0 12px rgba(242,166,121,.7); }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="system">
    <div class="orbit o3"></div><div class="orbit o2"></div><div class="orbit o1"></div>
    <div class="halo"></div>
    <div class="planet p-cre"></div>
    <div class="sun"><span>WENDY</span></div>
    <div class="planet p-eng"></div>
    <div class="planet p-jou"></div>
    <div class="planet p-fut"></div>
  </div>
  <div class="copy">
    <p class="eyebrow">Wendy’s Universe</p>
    <h1 class="brand">Wendy</h1>
    <p class="names"><span>Jiayi Fan</span><span class="dot">·</span><span class="zh">范佳怡</span></p>
    <p class="role">Software Engineer · Creative Technologist</p>
    <p class="tagline">One person. Many worlds. Endless possibilities.</p>
  </div>
  <div class="url"><i></i>wendyfan.com</div>
</body>
</html>
