# Netlify build + routing for wendyfan.com
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: /creativity (and any other path) is served by index.html.
# Not forced, so real files (assets, images, CV PDFs) are still served directly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change — cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
